<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>voice-flow</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell" aria-label="voice-flow voice input">
      <nav class="mode-nav" aria-label="Desktop mode" data-tauri-drag-region="deep">
        <button
          class="mode-tab is-active"
          type="button"
          aria-selected="true"
          data-mode-tab="floating"
        >
          Floating Input
        </button>
        <button
          class="mode-tab"
          type="button"
          aria-selected="false"
          data-mode-tab="settings"
        >
          Settings
        </button>
      </nav>

      <section class="status-row" data-tauri-drag-region="deep">
        <div class="status-dot" data-state="idle" aria-hidden="true"></div>
        <div class="status-text">
          <p class="label">voice-flow</p>
          <h1 id="state-label">待机</h1>
        </div>
        <button id="pause-toggle" class="icon-button" type="button" title="暂停监听">
          <span aria-hidden="true">||</span>
        </button>
        <button id="settings-toggle" class="icon-button" type="button" title="设置">
          <span aria-hidden="true">...</span>
        </button>
      </section>

      <section class="mode-pane" data-mode-pane="floating" aria-label="Floating Input">
        <section class="floating-panel" aria-label="Floating Input status">
          <button
            id="mic-button"
            class="mic-button"
            type="button"
            aria-label="Floating microphone"
            title="点击开始/结束；Alt+Space 按住说话"
          >
            <span class="mic-icon" aria-hidden="true"></span>
          </button>

          <span id="rewrite-chip" hidden>改写关闭</span>
          <span id="last-transcript" hidden>尚无识别结果</span>

          <div class="result-meta" id="result-meta" hidden>
            <span id="fallback-reason"></span>
            <span id="latency-summary"></span>
          </div>

          <div class="variant-panel" id="variant-panel" hidden aria-label="改写候选">
            <div class="variant-tabs" role="tablist" aria-label="改写版本">
              <button class="variant-tab is-active" type="button" data-variant-tab="clean">
                Clean
              </button>
              <button class="variant-tab" type="button" data-variant-tab="polish">
                Polish
              </button>
              <button class="variant-tab" type="button" data-variant-tab="wechat">
                Wechat
              </button>
              <button class="variant-tab" type="button" data-variant-tab="bullets">
                Bullets
              </button>
            </div>
            <div class="variant-actions">
              <button id="copy-variant" type="button">复制选中版本</button>
              <button id="paste-variant" type="button">粘贴选中版本</button>
              <span id="variant-action-status"></span>
            </div>
            <p id="variant-text"></p>
          </div>
        </section>

        <section class="runtime-error" id="runtime-error" hidden aria-label="运行错误">
          <p class="label">错误详情</p>
          <p id="runtime-error-text"></p>
        </section>
      </section>

      <section class="settings mode-pane" id="settings-panel" data-mode-pane="settings" hidden aria-label="Settings">
        <div class="settings-header" data-tauri-drag-region="deep">
          <strong>Settings</strong>
          <button id="settings-close" class="settings-close" type="button">返回</button>
        </div>

        <div class="settings-tabs" role="tablist" aria-label="设置分组">
          <button
            class="settings-tab is-active"
            type="button"
            role="tab"
            aria-selected="true"
            data-settings-tab="input"
          >
            输入
          </button>
          <button
            class="settings-tab"
            type="button"
            role="tab"
            aria-selected="false"
            data-settings-tab="rewrite"
          >
            改写
          </button>
          <button
            class="settings-tab"
            type="button"
            role="tab"
            aria-selected="false"
            data-settings-tab="diagnostics"
          >
            诊断
          </button>
        </div>

        <div class="settings-pane" data-settings-pane="input">
          <label class="field">
            <span>模型目录</span>
            <input id="model-dir" type="text" spellcheck="false" />
          </label>
          <div class="hotkey-grid" aria-label="快捷键设置">
            <label><input id="hotkey-ctrl" type="checkbox" />Ctrl</label>
            <label><input id="hotkey-alt" type="checkbox" />Alt</label>
            <label><input id="hotkey-shift" type="checkbox" />Shift</label>
            <label><input id="hotkey-logo" type="checkbox" />Win</label>
            <label class="field hotkey-key">
              <span>键</span>
              <input id="hotkey-key" type="text" />
            </label>
          </div>
        </div>

        <div class="settings-pane" data-settings-pane="rewrite" hidden>
          <label class="switch-row">
            <span>
              <strong>AI 改写</strong>
              <small id="rewrite-enabled-label">关闭</small>
            </span>
            <input id="rewrite-enabled" type="checkbox" role="switch" />
          </label>

          <label class="field">
            <span>默认档</span>
            <select id="rewrite-profile">
              <option value="clean">Clean</option>
              <option value="polish">Polish</option>
              <option value="email">Email</option>
              <option value="wechat">Wechat</option>
              <option value="bullets">Bullets</option>
              <option value="commit">Commit</option>
              <option value="prompt">Prompt</option>
              <option value="multi">Multi</option>
            </select>
          </label>

          <div class="field">
            <span>Provider</span>
            <div class="segmented" role="radiogroup" aria-label="Rewrite provider">
              <label>
                <input type="radio" name="rewrite-provider" value="deepseek" />
                <span>DeepSeek</span>
              </label>
              <label>
                <input type="radio" name="rewrite-provider" value="dashscope" />
                <span>DashScope</span>
              </label>
              <label>
                <input type="radio" name="rewrite-provider" value="openai" />
                <span>OpenAI</span>
              </label>
            </div>
          </div>

          <label class="field">
            <span>模型</span>
            <input id="rewrite-model" type="text" spellcheck="false" />
          </label>

          <div class="rewrite-grid">
            <label class="field">
              <span>超时 ms</span>
              <input id="rewrite-timeout" type="number" min="500" step="100" />
            </label>
            <label class="field">
              <span>API key</span>
              <input id="rewrite-api-key" type="password" autocomplete="off" />
            </label>
          </div>

          <div class="key-actions">
            <button id="clear-rewrite-key" type="button">清除 key</button>
            <span id="rewrite-key-status">未保存</span>
          </div>

          <div class="rewrite-summary" aria-label="当前改写设置">
            <span id="rewrite-provider-summary">deepseek</span>
            <span id="rewrite-profile-summary">clean</span>
            <span id="rewrite-key-summary">DEEPSEEK_API_KEY</span>
          </div>
          <p class="pane-note">API key 会保存到系统凭据管理器，不写入 app.toml；留空保存只更新改写设置。</p>
        </div>

        <div class="settings-pane" data-settings-pane="diagnostics" hidden>
          <div class="diagnostics-grid" id="diagnostics-grid">
            <span>配置</span>
            <strong id="diag-config-path">-</strong>
            <span>日志</span>
            <strong id="diag-log-path">-</strong>
            <span>模型目录</span>
            <strong id="diag-model-dir">-</strong>
            <span>Runtime</span>
            <strong id="diag-runtime">-</strong>
            <span>Rewrite key</span>
            <strong id="diag-rewrite-key">-</strong>
          </div>
          <button id="refresh-diagnostics" class="secondary-action" type="button">
            刷新诊断
          </button>
        </div>

        <div class="settings-actions">
          <button id="save-settings" type="button">保存</button>
          <span id="settings-message" role="status"></span>
        </div>
      </section>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
