<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>voice-flow</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell" aria-label="voice-flow 语音输入">
      <nav class="mode-nav" aria-label="模式切换" data-tauri-drag-region="deep">
        <button
          class="mode-tab"
          type="button"
          aria-selected="false"
          data-mode-tab="voice-pad"
        >
          文稿模式
        </button>
        <button
          class="mode-tab is-active"
          type="button"
          aria-selected="true"
          data-mode-tab="floating"
        >
          悬浮窗模式
        </button>
        <button
          class="mode-tab"
          type="button"
          aria-selected="false"
          data-mode-tab="settings"
        >
          设置
        </button>
      </nav>

      <section id="document-pane" class="document-mode mode-pane" data-mode-pane="voice-pad" hidden aria-label="文稿模式">
        <section class="document-status-row" data-tauri-drag-region="deep">
          <div id="document-status-dot" class="document-status-dot" data-state="idle" aria-hidden="true"></div>
          <div class="document-status-text">
            <p class="label">voice-flow</p>
            <h1 id="document-state-label">待机</h1>
          </div>
          <button id="document-pause-toggle" class="icon-button" type="button" title="暂停监听">
            <span aria-hidden="true">||</span>
          </button>
          <button id="document-settings-toggle" class="icon-button" type="button" title="设置">
            <span aria-hidden="true">...</span>
          </button>
          <button id="document-close-app" class="icon-button" type="button" title="关闭并退出">
            <span aria-hidden="true">X</span>
          </button>
        </section>

        <section class="document-card document-card-editor" aria-label="文稿编辑区">
          <div class="document-editor-header">
            <div>
              <p class="label">文稿编辑区</p>
              <p id="document-editor-mode-hint" class="document-editor-hint">新结果将插入到当前光标位置</p>
            </div>
            <div class="document-editor-actions">
              <button class="document-editor-mode is-active" type="button" data-document-apply-mode="insert">
                插入光标
              </button>
              <button class="document-editor-mode" type="button" data-document-apply-mode="replace">
                替换全文
              </button>
              <button class="document-editor-mode" type="button" data-document-apply-mode="append">
                追加末尾
              </button>
            </div>
          </div>

          <textarea
            id="document-editor"
            class="document-editor"
            spellcheck="false"
            placeholder="文稿模式下，语音结果会写入这里。你也可以手动编辑。"
          ></textarea>

          <div class="document-editor-toolbar">
            <button id="document-copy-editor" type="button">复制全文稿</button>
            <button id="document-clear-editor" type="button">清空文稿</button>
            <span id="document-editor-status"></span>
          </div>
        </section>

        <section class="document-runtime-error" id="document-runtime-error" hidden aria-label="运行错误">
          <p class="label">错误详情</p>
          <p id="document-runtime-error-text"></p>
        </section>
      </section>

      <section id="floating-pane" class="floating-mode mode-pane" data-mode-pane="floating" aria-label="悬浮窗模式">
        <section class="floating-panel" aria-label="悬浮窗状态">
          <div class="floating-drag-handle" data-tauri-drag-region="deep" aria-hidden="true"></div>
          <button
            id="floating-mic-button"
            class="floating-mic-button"
            type="button"
            aria-label="麦克风"
            title="点击开始/结束；Alt+Space 按住说话"
          >
            <span class="floating-mic-icon" aria-hidden="true"></span>
          </button>
        </section>
      </section>

      <section class="settings-mode mode-pane" id="settings-panel" data-mode-pane="settings" hidden aria-label="设置">
        <div class="settings-header" data-tauri-drag-region="deep">
          <strong>设置</strong>
          <button id="settings-close" class="settings-close" type="button">返回</button>
        </div>

        <div class="settings-tabs" role="tablist" aria-label="设置分组">
          <button
            class="settings-tab is-active"
            type="button"
            role="tab"
            aria-selected="true"
            data-settings-tab="input"
          >
            输入
          </button>
          <button
            class="settings-tab"
            type="button"
            role="tab"
            aria-selected="false"
            data-settings-tab="rewrite"
          >
            改写
          </button>
        </div>

        <div class="settings-pane" data-settings-pane="input">
          <div class="field">
            <span>ASR 引擎</span>
            <div class="segmented" role="radiogroup" aria-label="ASR engine">
              <label>
                <input type="radio" name="settings-asr-engine" value="local" />
                <span>Local</span>
              </label>
              <label>
                <input type="radio" name="settings-asr-engine" value="cloud" />
                <span>Cloud</span>
              </label>
            </div>
          </div>

          <div id="settings-asr-cloud-fields" class="settings-asr-cloud-fields" hidden>
            <label class="field">
              <span>DashScope API key</span>
              <input id="settings-asr-api-key" type="password" autocomplete="off" />
            </label>
            <div class="key-actions">
              <button id="settings-clear-asr-key" type="button">清除 key</button>
              <span id="settings-asr-key-status">未保存</span>
            </div>
            <p class="pane-note">Cloud ASR 使用 DashScope Paraformer-realtime-v2。API key 保存到系统凭据管理器，不写入 app.toml。</p>
          </div>

          <label class="field">
            <span>快捷键</span>
            <input id="settings-hotkey-combo" type="text" spellcheck="false" placeholder="例如：alt+space" />
          </label>
          <p class="pane-note">支持 ctrl/alt/shift/win 组合，最后一段是主键。例：alt+space、ctrl+shift+r。</p>
        </div>

        <div class="settings-pane" data-settings-pane="rewrite" hidden>
          <label class="switch-row">
            <span>
              <strong>AI 改写</strong>
              <small id="settings-rewrite-enabled-label">关闭</small>
            </span>
            <input id="settings-rewrite-enabled" type="checkbox" role="switch" />
          </label>

          <label class="field">
            <span>改写风格</span>
            <select id="settings-rewrite-profile">
              <option value="clean">Clean</option>
              <option value="polish">Polish</option>
              <option value="email">Email</option>
              <option value="wechat">Wechat</option>
              <option value="bullets">Bullets</option>
              <option value="commit">Commit</option>
              <option value="prompt">Prompt</option>
              <option value="multi">Multi</option>
            </select>
          </label>

        </div>

        <div class="settings-actions">
          <button id="settings-save" type="button">保存</button>
          <span id="settings-message" role="status"></span>
        </div>
      </section>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
