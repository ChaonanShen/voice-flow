<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>voice-flow</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell" aria-label="voice-flow 语音输入">
      <nav class="mode-nav" aria-label="模式切换" data-tauri-drag-region="deep">
        <button
          class="mode-tab"
          type="button"
          aria-selected="false"
          data-mode-tab="voice-pad"
        >
          文稿模式
        </button>
        <button
          class="mode-tab is-active"
          type="button"
          aria-selected="true"
          data-mode-tab="floating"
        >
          悬浮窗模式
        </button>
        <button
          class="mode-tab"
          type="button"
          aria-selected="false"
          data-mode-tab="settings"
        >
          设置
        </button>
      </nav>

      <section id="document-pane" class="document-mode mode-pane" data-mode-pane="voice-pad" hidden aria-label="文稿模式">
        <section class="document-status-row" data-tauri-drag-region="deep">
          <div id="document-status-dot" class="document-status-dot" data-state="idle" aria-hidden="true"></div>
          <div class="document-status-text">
            <p class="label">voice-flow</p>
            <h1 id="document-state-label">待机</h1>
          </div>
          <button id="document-pause-toggle" class="icon-button" type="button" title="暂停监听">
            <span aria-hidden="true">||</span>
          </button>
          <button id="document-settings-toggle" class="icon-button" type="button" title="设置">
            <span aria-hidden="true">...</span>
          </button>
        </section>

        <section class="document-main" aria-label="文稿工作区">
          <section class="document-card document-card-transcript" aria-label="最近一次识别文本">
            <div class="document-transcript-meta">
              <p class="label">最近转写</p>
              <div class="document-chip-row">
                <span id="document-output-chip">输出到文稿</span>
                <span id="document-rewrite-chip">改写关闭</span>
              </div>
            </div>
            <p id="document-last-text">尚无识别结果</p>

            <div class="document-result-meta" id="document-result-meta" hidden>
              <span id="document-fallback-reason"></span>
              <span id="document-latency-summary"></span>
            </div>
          </section>

          <section class="document-card document-card-diff" aria-label="原始转写与最终输出差异">
            <div class="document-diff-header">
              <p class="label">转写与输出</p>
              <span id="document-profile-chip">off</span>
            </div>
            <div class="document-diff-grid">
              <article class="document-diff-block">
                <p class="document-diff-label">原始转写</p>
                <div id="document-diff-raw" class="document-diff-content">尚无转写结果</div>
              </article>
              <article class="document-diff-block">
                <p class="document-diff-label">最终输出</p>
                <div id="document-diff-final" class="document-diff-content">尚无输出结果</div>
              </article>
            </div>
          </section>

          <section class="document-card document-card-editor" aria-label="文稿编辑区">
            <div class="document-editor-header">
              <div>
                <p class="label">文稿编辑区</p>
                <p id="document-editor-mode-hint" class="document-editor-hint">新结果将插入到当前光标位置</p>
              </div>
              <div class="document-editor-actions">
                <button class="document-editor-mode is-active" type="button" data-document-apply-mode="insert">
                  插入光标
                </button>
                <button class="document-editor-mode" type="button" data-document-apply-mode="replace">
                  替换全文
                </button>
                <button class="document-editor-mode" type="button" data-document-apply-mode="append">
                  追加末尾
                </button>
              </div>
            </div>

            <textarea
              id="document-editor"
              class="document-editor"
              spellcheck="false"
              placeholder="文稿模式下，语音结果会写入这里。你也可以手动编辑。"
            ></textarea>

            <div class="document-editor-toolbar">
              <button id="document-copy-final" type="button">复制最终输出</button>
              <button id="document-copy-editor" type="button">复制全文稿</button>
              <button id="document-clear-editor" type="button">清空文稿</button>
              <span id="document-editor-status"></span>
            </div>
          </section>

          <div class="document-variant-panel" id="document-variant-panel" hidden aria-label="改写候选">
            <div class="document-variant-tabs" role="tablist" aria-label="改写版本">
              <button class="document-variant-tab is-active" type="button" data-variant-tab="clean">
                Clean
              </button>
              <button class="document-variant-tab" type="button" data-variant-tab="polish">
                Polish
              </button>
              <button class="document-variant-tab" type="button" data-variant-tab="wechat">
                Wechat
              </button>
              <button class="document-variant-tab" type="button" data-variant-tab="bullets">
                Bullets
              </button>
            </div>
            <div class="document-variant-actions">
              <button id="document-copy-variant" type="button">复制选中版本</button>
              <button id="document-paste-variant" type="button">写入文稿</button>
              <span id="document-variant-action-status"></span>
            </div>
            <p id="document-variant-text"></p>
          </div>
        </section>

        <section class="document-runtime-error" id="document-runtime-error" hidden aria-label="运行错误">
          <p class="label">错误详情</p>
          <p id="document-runtime-error-text"></p>
        </section>
      </section>

      <section id="floating-pane" class="floating-mode mode-pane" data-mode-pane="floating" aria-label="悬浮窗模式">
        <section class="floating-panel" aria-label="悬浮窗状态">
          <div class="floating-drag-handle" data-tauri-drag-region="deep" aria-hidden="true"></div>
          <button
            id="floating-mic-button"
            class="floating-mic-button"
            type="button"
            aria-label="麦克风"
            title="点击开始/结束；Alt+Space 按住说话"
          >
            <span class="floating-mic-icon" aria-hidden="true"></span>
          </button>
        </section>
      </section>

      <section class="settings-mode mode-pane" id="settings-panel" data-mode-pane="settings" hidden aria-label="设置">
        <div class="settings-header" data-tauri-drag-region="deep">
          <strong>设置</strong>
          <button id="settings-close" class="settings-close" type="button">返回</button>
        </div>

        <div class="settings-tabs" role="tablist" aria-label="设置分组">
          <button
            class="settings-tab is-active"
            type="button"
            role="tab"
            aria-selected="true"
            data-settings-tab="input"
          >
            输入
          </button>
          <button
            class="settings-tab"
            type="button"
            role="tab"
            aria-selected="false"
            data-settings-tab="rewrite"
          >
            改写
          </button>
          <button
            class="settings-tab"
            type="button"
            role="tab"
            aria-selected="false"
            data-settings-tab="diagnostics"
          >
            诊断
          </button>
        </div>

        <div class="settings-pane" data-settings-pane="input">
          <label class="field">
            <span>模型目录</span>
            <input id="settings-model-dir" type="text" spellcheck="false" />
          </label>
          <div class="hotkey-grid" aria-label="快捷键设置">
            <label><input id="settings-hotkey-ctrl" type="checkbox" />Ctrl</label>
            <label><input id="settings-hotkey-alt" type="checkbox" />Alt</label>
            <label><input id="settings-hotkey-shift" type="checkbox" />Shift</label>
            <label><input id="settings-hotkey-logo" type="checkbox" />Win</label>
            <label class="field hotkey-key">
              <span>键</span>
              <input id="settings-hotkey-key" type="text" />
            </label>
          </div>
        </div>

        <div class="settings-pane" data-settings-pane="rewrite" hidden>
          <label class="switch-row">
            <span>
              <strong>AI 改写</strong>
              <small id="settings-rewrite-enabled-label">关闭</small>
            </span>
            <input id="settings-rewrite-enabled" type="checkbox" role="switch" />
          </label>

          <label class="field">
            <span>默认档</span>
            <select id="settings-rewrite-profile">
              <option value="clean">Clean</option>
              <option value="polish">Polish</option>
              <option value="email">Email</option>
              <option value="wechat">Wechat</option>
              <option value="bullets">Bullets</option>
              <option value="commit">Commit</option>
              <option value="prompt">Prompt</option>
              <option value="multi">Multi</option>
            </select>
          </label>

          <div class="field">
            <span>Provider</span>
            <div class="segmented" role="radiogroup" aria-label="Rewrite provider">
              <label>
                <input type="radio" name="settings-rewrite-provider" value="deepseek" />
                <span>DeepSeek</span>
              </label>
              <label>
                <input type="radio" name="settings-rewrite-provider" value="dashscope" />
                <span>DashScope</span>
              </label>
              <label>
                <input type="radio" name="settings-rewrite-provider" value="openai" />
                <span>OpenAI</span>
              </label>
            </div>
          </div>

          <label class="field">
            <span>模型</span>
            <input id="settings-rewrite-model" type="text" spellcheck="false" />
          </label>

          <div class="rewrite-grid">
            <label class="field">
              <span>超时 ms</span>
              <input id="settings-rewrite-timeout" type="number" min="500" step="100" />
            </label>
            <label class="field">
              <span>API key</span>
              <input id="settings-rewrite-api-key" type="password" autocomplete="off" />
            </label>
          </div>

          <div class="key-actions">
            <button id="settings-clear-rewrite-key" type="button">清除 key</button>
            <span id="settings-rewrite-key-status">未保存</span>
          </div>

          <div class="rewrite-summary" aria-label="当前改写设置">
            <span id="settings-rewrite-provider-summary">deepseek</span>
            <span id="settings-rewrite-profile-summary">clean</span>
            <span id="settings-rewrite-key-summary">DEEPSEEK_API_KEY</span>
          </div>
          <p class="pane-note">API key 会保存到系统凭据管理器，不写入 app.toml；留空保存只更新改写设置。</p>
        </div>

        <div class="settings-pane" data-settings-pane="diagnostics" hidden>
          <div class="diagnostics-grid" id="settings-diagnostics-grid">
            <span>配置</span>
            <strong id="settings-diag-config-path">-</strong>
            <span>日志</span>
            <strong id="settings-diag-log-path">-</strong>
            <span>模型目录</span>
            <strong id="settings-diag-model-dir">-</strong>
            <span>Runtime</span>
            <strong id="settings-diag-runtime">-</strong>
            <span>Rewrite key</span>
            <strong id="settings-diag-rewrite-key">-</strong>
          </div>
          <button id="settings-refresh-diagnostics" class="secondary-action" type="button">
            刷新诊断
          </button>
        </div>

        <div class="settings-actions">
          <button id="settings-save" type="button">保存</button>
          <span id="settings-message" role="status"></span>
        </div>
      </section>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
