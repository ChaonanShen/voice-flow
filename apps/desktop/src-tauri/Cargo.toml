[workspace]

[package]
name = "voice-flow-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
repository = "https://github.com/ChaonanShen/voice-flow"
authors = ["voice-flow contributors"]
description = "Windows-first Tauri desktop shell for voice-flow"
build = "build.rs"

[dependencies]
anyhow = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.2", default-features = false, features = ["wry"] }
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["rt", "time"] }
voice-asr-local = { path = "../../../crates/voice-asr-local" }
voice-core = { path = "../../../crates/voice-core" }
voice-rewrite = { path = "../../../crates/voice-rewrite" }

[build-dependencies]
tauri-build = { version = "2.6.2", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
