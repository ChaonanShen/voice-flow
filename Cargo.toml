[workspace]
resolver = "2"
members = ["crates/voice-core", "crates/voice-asr-local", "crates/voice-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
repository = "https://github.com/ChaonanShen/voice-flow"
authors = ["voice-flow contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
