[package]
name = "voice-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "CLI verification tool for the voice input pipeline"

[[bin]]
name = "voice-cli"
path = "src/main.rs"

[dependencies]
voice-core = { path = "../voice-core" }
voice-asr-local = { path = "../voice-asr-local" }
voice-asr-cloud = { path = "../voice-asr-cloud" }
voice-rewrite = { path = "../voice-rewrite" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dotenvy = "0.15"
humantime = "2"
tokio = { version = "1", features = ["rt", "time"] }

[lints]
workspace = true
