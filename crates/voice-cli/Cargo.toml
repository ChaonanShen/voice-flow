[package]
name = "voice-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "CLI verification tool for the voice input pipeline"

[[bin]]
name = "voice-cli"
path = "src/main.rs"

[dependencies]
voice-core = { path = "../voice-core" }
voice-asr-local = { path = "../voice-asr-local" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
humantime = "2"

[lints]
workspace = true
